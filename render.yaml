services:
  - type: web
    name: transfer-auction
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: transfer-auction-db
          property: connectionString
databases:
  - name: transfer-auction-db
    databaseName: transfer_auction
    user: transfer_auction
